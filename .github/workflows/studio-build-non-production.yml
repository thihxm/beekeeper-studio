name: Studio - Build [non production]

permissions:
  contents: read
  actions: write

on:
  pull_request:
    paths-ignore:
      - apps/sqltools/**
      - docs/**
  push:
    branches:
      - "master"
    paths-ignore:
      - 'apps/sqltools/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A master push that changes the app version is a release commit: it builds
  # every target studio-publish.yml ships (macOS x64 included, on the free
  # macos-15-intel runner) so each can be tested from the draft release.
  # Pull requests and other master pushes keep the lighter build.
  plan:
    runs-on: ubuntu-22.04
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect release commit
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          release=false
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/master ]; then
            version=$(node -p "require('./apps/studio/package.json').version")
            previous=$(git show HEAD^:apps/studio/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            echo "version: $previous -> $version"
            if [ "$version" != "$previous" ]; then release=true; fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  masterbuild:
    runs-on: ${{ matrix.os }}
    needs: plan

    strategy:
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.release == 'true' && '["macos-14", "macos-15-intel", "ubuntu-22.04", "windows-2022", "ubuntu-22.04-arm"]' || '["macos-14", "ubuntu-22.04", "windows-2022", "ubuntu-22.04-arm"]') }}

    steps:
      # core24 snaps build in LXD; only release builds produce snaps.
      - name: setup LXD
        uses: canonical/setup-lxd@main
        if: needs.plan.outputs.release == 'true' && contains(matrix.os, 'ubuntu')

      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@v3
        if: "contains(matrix.os, 'ubuntu')"
        with:
          channel: '8.x/stable'

      - name: Install python 3.11 (not Mac)
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
        if: "!startsWith(matrix.os, 'macos')"


      - name: Install flatpak tools
        if: "contains(matrix.os, 'ubuntu')"
        run: bash ./.github/scripts/install-build-deps.sh

      - name: Install ODBC build dependencies (linux)
        if: "contains(matrix.os, 'ubuntu')"
        run: bash ./.github/scripts/linux-install-odbc-deps.sh

      - name: Install ODBC build dependencies (macos)
        if: "startsWith(matrix.os, 'macos')"
        run: bash ./.github/scripts/macos-install-odbc-deps.sh

      - name: Install fpm
        run: sudo gem install fpm -v 1.17.0
        if: "contains(matrix.os, 'ubuntu')"

      - name: Install python 3.11 (mac)
        if: "startsWith(matrix.os, 'macos')"
        id: mac_python
        run: |
          # The Intel image ships python 3.11 links that block brew's (same
          # cleanup as studio-publish.yml).
          rm -f /usr/local/bin/2to3-3.11 /usr/local/bin/idle3.11 /usr/local/bin/pydoc3.11 \
            /usr/local/bin/python3.11 /usr/local/bin/python3.11-config
          brew install python@3.11
          # /opt/homebrew on arm64, /usr/local on Intel
          PYTHON_BIN="$(brew --prefix python@3.11)/libexec/bin"
          echo "$PYTHON_BIN" >> $GITHUB_PATH
          echo "python_path=$PYTHON_BIN/python3" >> $GITHUB_OUTPUT

      - name: Verify Python Version
        if: "startsWith(matrix.os, 'windows')"
        run: |
          $PYTHON_VERSION = python --version | Out-String
          Write-Output "Installed Python version: $PYTHON_VERSION"
          if (-not $PYTHON_VERSION.StartsWith("Python 3.11")) {
            Write-Output "Error: Python version does not start with 3.11"
            exit 1
          }
        shell: powershell

      - name: Verify Python Version
        if: "!startsWith(matrix.os, 'windows')"
        run: |
          PYTHON_VERSION=$(python3 --version | cut -d " " -f 2)
          echo "Installed Python version: $PYTHON_VERSION"
          if [[ ! $PYTHON_VERSION == 3.11* ]]; then
            echo "Error: Python version does not start with 3.11"
            exit 1
          fi

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      # ImageOS identifies the runner image (e.g. ubuntu22, win22, macos14), so
      # caches never cross runner image versions: node_modules holds native
      # modules compiled for one exact image.
      - name: Compute runner image cache id
        shell: bash
        run: echo "RUNNER_IMAGE_ID=${ImageOS:-unknown}" >> "$GITHUB_ENV"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/studio/node_modules
            apps/ui-kit/node_modules
            apps/sqltools/node_modules
          key: node-modules-${{ env.RUNNER_IMAGE_ID }}-${{ runner.arch }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('yarn.lock') }}

      # For msnodesqlv8, if it previously failed in the cached version, clear the cache and try again :)
      - name: Check restored node_modules
        id: nm-health
        if: steps.cache-nm.outputs.cache-hit == 'true'
        continue-on-error: true
        run: node -e "require('msnodesqlv8')"

      - name: Discard broken node_modules
        if: steps.nm-health.outcome == 'failure'
        run: rm -rf node_modules apps/studio/node_modules apps/ui-kit/node_modules apps/sqltools/node_modules

      - name: Clean cache
        if: steps.cache-nm.outputs.cache-hit != 'true' || steps.nm-health.outcome == 'failure'
        run: yarn cache clean

      - name: Check dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true' || steps.nm-health.outcome == 'failure'
        run: "yarn install --frozen-lockfile --network-timeout 100000"
        env:
          npm_config_node_gyp: ${{ github.workspace }}${{ runner.os == 'Windows' && '\node_modules\node-gyp\bin\node-gyp.js' || '/node_modules/node-gyp/bin/node-gyp.js' }}

      - name: Verify msnodesqlv8 native build
        run: node -e "require('msnodesqlv8')"

      - name: Build Electron app
        run: "yarn run electron:build --publish never"
        if: startsWith(matrix.os, 'ubuntu') == false
        env:
          PYTHON_PATH: "${{ startsWith(matrix.os, 'macos') && steps.mac_python.outputs.python_path || '$PYTHON_PATH' }}"
          PYTHONPATH: "${{ startsWith(matrix.os, 'macos') && steps.mac_python.outputs.python_path || '$PYTHONPATH' }}"
          SNAPCRAFT_BUILD_ENVIRONMENT: 'lxd'
          USE_SYSTEM_FPM: true

        # Release builds produce every Linux target in electron-builder-config.js;
        # other runs only build the deb for hardlinks testing.
      - name: Build Electron app
        run: yarn run electron:build --publish never ${{ needs.plan.outputs.release == 'true' && '--linux' || '--linux deb' }}
        if: startsWith(matrix.os, 'ubuntu')
        env:
          PYTHON_PATH: "${{ startsWith(matrix.os, 'macos') && steps.mac_python.outputs.python_path || '$PYTHON_PATH' }}"
          PYTHONPATH: "${{ startsWith(matrix.os, 'macos') && steps.mac_python.outputs.python_path || '$PYTHONPATH' }}"
          SNAPCRAFT_BUILD_ENVIRONMENT: 'lxd'
          USE_SYSTEM_FPM: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os }}
          path: |
            apps/studio/dist_electron/*.exe
            apps/studio/dist_electron/*.deb
            apps/studio/dist_electron/*.rpm
            apps/studio/dist_electron/*.AppImage
            apps/studio/dist_electron/*.dmg
            apps/studio/dist_electron/*.snap
            apps/studio/dist_electron/*.flatpak
            apps/studio/dist_electron/*.pacman
            apps/studio/dist_electron/*.zip
            apps/studio/dist_electron/*.yml

  test-deb-hardlinks:
    name: Test DEB on separate filesystems
    runs-on: ubuntu-22.04
    needs: masterbuild

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Download DEB artifact
        uses: actions/download-artifact@v7
        with:
          name: ubuntu-22.04
          path: ./deb-package

      - name: List downloaded files
        run: |
          echo "Contents of deb-package directory:"
          ls -lh ./deb-package/

      - name: Find DEB file
        id: find_deb
        run: |
          DEB_FILE=$(find ./deb-package -name "*.deb" | head -n 1)
          if [ -z "$DEB_FILE" ]; then
            echo "ERROR: No .deb file found in artifact"
            exit 1
          fi
          echo "deb_file=$DEB_FILE" >> $GITHUB_OUTPUT
          echo "Found DEB file: $DEB_FILE"

      - name: Make test script executable
        run: chmod +x ./bin/test-deb-hardlinks.sh

      - name: Run hardlinks test
        run: |
          echo "Testing: ${{ steps.find_deb.outputs.deb_file }}"
          ./bin/test-deb-hardlinks.sh "${{ steps.find_deb.outputs.deb_file }}"

      - name: Test result
        if: success()
        run: |
          echo "✓ DEB package successfully installs on separate filesystems"
          echo "✓ No hardlinks regression detected"

  # Attach a release commit's builds to the draft release of its version, so
  # they can be downloaded from the release page instead of the run's
  # artifacts. Assets are named nonprod-*, never touch the signed production
  # assets, and release-published.yml keeps them out of every user channel.
  publish-release-assets:
    name: Attach builds to the draft release
    runs-on: ubuntu-22.04
    needs: [plan, masterbuild, test-deb-hardlinks]
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./nonprod-builds

      - name: Upload non-production assets to the release
        uses: actions/github-script@v8
        with:
          script: |
            const script = require('./.github/scripts/upload_nonprod_release_assets.js')
            const { version } = require('./apps/studio/package.json')
            await script({ github, context, core }, { dir: './nonprod-builds', version })
